name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # keep contribution cells visible: strip the "eaten cell" fill animations so the
      # snake slithers across the graph without erasing any commit squares
      - name: disable cell-eating in the generated SVGs
        run: |
          python3 - <<'EOF'
          import re, glob
          for f in glob.glob('dist/*.svg'):
              c = open(f, encoding='utf-8').read()
              c = re.sub(r'(\.c\.c\w+\{fill:var\(--c\d+\));animation-name:c\w+', r'\1', c)
              open(f, 'w', encoding='utf-8').write(c)
              print(f, 'cell animations left:', len(re.findall(r'\.c\.c\w+\{[^}]*animation-name:', c)))
          EOF

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
