name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # custom generator: contribution grid + snake that patrols the perimeter
      # (never crosses or eats the commit cells)
      - name: generate perimeter-patrol snake SVGs
        run: |
          mkdir -p dist
          python3 scripts/generate_snake.py "${{ github.repository_owner }}" dist

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
